[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-support"
version = "0.2.0"
description = "Aegis customer support assistant with guarded routing, retrieval and tools"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "sentence-transformers>=3,<6",
  "python-dotenv>=1,<2",
  "redis>=5,<9",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
aegis-rag = "support_assistant.entrypoints.cli:main"
aegis-support = "support_assistant.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_assistant = ["prompts/*.md", "prompts/*.json"]
