[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-support"
version = "0.4.0"
description = "Aegis customer support assistant with guarded routing, retrieval and tools"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "sentence-transformers>=3,<6",
  "python-dotenv>=1,<2",
  "redis>=5,<9",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
voice = ["onnxruntime>=1.18,<2", "piper-tts>=1.3,<2", "websockets>=13,<16"]
dev = ["ruff==0.17.1"]

[project.scripts]
aegis-rag = "support_assistant.entrypoints.cli:main"
aegis-support = "support_assistant.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_assistant = ["prompts/*.md", "prompts/*.json", "entrypoints/web/*", "adapters/tts/recovery/*.wav"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/frontend/browser_smoke.py" = ["E402"]
